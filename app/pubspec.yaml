name: rudra
description: A personal AI agent with a native desktop GUI and a real memory.
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State. docs/ui-guidelines.md §12 — one provider per concern, and streaming
  # deltas deliberately stay OUT of the provider graph (INVARIANT 11).
  flutter_riverpod: ^3.4.3

  # HTTP + SSE. `Client.send` exposes the response as a stream, which is what
  # token streaming needs; `package:http` is the portable way to get it.
  http: ^1.6.0

  meta: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
