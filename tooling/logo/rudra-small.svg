<!--
  Rudra's mark at small sizes: the ocellus alone.

  Below about 64px the plume in `rudra.svg` collapses into a grey smudge and
  the silhouette reads as a map pin rather than a feather. This file keeps what
  survives downsampling — the concentric bands of the eye — and drops what does
  not. Shipping distinct artwork for small sizes is what macOS and Windows icon
  sets have always done; it is not a workaround.

  The bands are sized against the 16px case: at 16px one band is about 1.2
  device pixels, which is the floor at which a ring still reads as a ring. That
  budget is why the eye here is proportionally larger, and flatter in its
  colour steps, than the eye in the full mark.

  What carries the character rather than the legibility: a fringe of barb stubs
  all the way round (with a gap at the bottom where the quill comes in, so the
  mark does not read as a lollipop), radial grain across the bronze, and the
  same reniform heart, specular and rim light as the full mark. None of that
  survives 16px, and all of it tells at 32px and above.

  Edit both files together, or the icon changes character halfway down the size
  ladder.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Flatter gradients than the full mark's on purpose. A steep ramp across
         a band that is one device pixel wide at 16px turns the band into a
         crescent: the lit side reads, the shaded side disappears. -->
    <linearGradient id="barb" x1="256" y1="24" x2="256" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7DD8FA"/>
      <stop offset="0.5" stop-color="#2FA2EC"/>
      <stop offset="1" stop-color="#33357F"/>
    </linearGradient>
    <linearGradient id="rachis" x1="246" y1="0" x2="268" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8FB6E8"/>
      <stop offset="0.38" stop-color="#E8F2FD"/>
      <stop offset="1" stop-color="#7E9FD0"/>
    </linearGradient>
    <radialGradient id="bronze" cx="150" cy="150" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EBCB8A"/>
      <stop offset="0.45" stop-color="#C79A4E"/>
      <stop offset="1" stop-color="#7A5622"/>
    </radialGradient>
    <radialGradient id="verdigris" cx="166" cy="172" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3CCFC6"/>
      <stop offset="0.5" stop-color="#119093"/>
      <stop offset="1" stop-color="#0A566E"/>
    </radialGradient>
    <radialGradient id="azure" cx="186" cy="192" r="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5CC6F4"/>
      <stop offset="0.45" stop-color="#1B74D4"/>
      <stop offset="1" stop-color="#0B57BE"/>
    </radialGradient>
    <radialGradient id="heart" cx="190" cy="196" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2E3C9C"/>
      <stop offset="0.4" stop-color="#101856"/>
      <stop offset="1" stop-color="#04061A"/>
    </radialGradient>
    <radialGradient id="spec" cx="212" cy="216" r="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EAF7FE" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#CFEAFD" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#CFEAFD" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="160" y1="190" x2="350" y2="364" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#6FACF7" stop-opacity="0"/>
      <stop offset="1" stop-color="#6FACF7" stop-opacity="0.4"/>
    </linearGradient>
    <clipPath id="heart-clip">
      <path d="M 256 147 C 252 141 243 138 233 140 C 215 144 205 163 206 185 C 208 207 221 222 239 229 C 245 232 251 233 256 233 C 262 233 268 232 274 229 C 292 222 305 206 306 184 C 307 162 297 143 279 139 C 269 137 260 141 256 147 Z" transform="translate(256 260) scale(1.82) rotate(-4) translate(-256 -186)"/>
    </clipPath>
    <clipPath id="bronze-clip">
      <ellipse cx="256" cy="264" rx="208" ry="196"/>
    </clipPath>
  </defs>

  <!-- quill: a stub, so the eye reads as part of a feather rather than a pin -->
  <path d="M 256 498 C 262 488 263 460 262 436 L 250 436 C 249 460 250 488 256 498 Z" fill="url(#rachis)" opacity="0.8"/>

