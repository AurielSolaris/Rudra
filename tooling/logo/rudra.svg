<!--
  Rudra's mark: a peacock feather (mayura-piccha).

  This file is the MASTER. It is hand-editable SVG, and it is the reason the
  logo is resolution-independent: every raster the app ships is produced from
  it by `bun run logo`, never drawn by hand and never edited as a PNG.

  Colours come from the project palette (docs/decisions/0002-palette.md) rather
  than from a stock feather photograph: azure #0B57BE, cyan #38C8F8, sky
  #6FACF7, indigo #383888. The bronze outer ring is the one colour outside the
  palette, because a peacock ocellus without it reads as a target, not a
  feather.

  Companion file: `rudra-small.svg`, a simplified ocellus used at 64px and
  below. See the note at the top of `index.ts` for why two masters exist.
-->
